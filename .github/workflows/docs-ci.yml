name: Documentation CI

on:
  push:
    branches: ["main"]
    paths: &doc_paths
      - "docs/**"
      - "documentation/**"
      - "mkdocs.yml"
      - "README.md"
      - "Changelog"
      - "ansible/README.md"
      - "docker/mariadb/README.md"
      - "requirements-docs.txt"
      - ".vale.ini"
      - ".markdownlint.json"
      - "scripts/mkdocs_hooks.py"
      - "scripts/build_versioned_docs.py"
      - ".github/workflows/docs-ci.yml"
      - ".github/workflows/docs-publish.yml"
      - "tests/test_diataxis_documentation.py"
      - "tests/test_diataxis_ste.py"
      - "tests/test_mkdocs_publishing.py"
      - "tests/test_docs_publish_workflow.py"
  pull_request:
    branches: ["main"]
    paths: *doc_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-quality:
    name: Validate Diataxis, STE, Links, and MkDocs Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-docs.txt"
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt pyyaml
      - name: Run Diataxis, STE, and MkDocs publishing unit tests
        run: python -m unittest tests/test_diataxis_documentation.py tests/test_diataxis_ste.py tests/test_mkdocs_publishing.py tests/test_docs_publish_workflow.py -v
      - name: Build MkDocs site in strict mode
        run: mkdocs build --strict
